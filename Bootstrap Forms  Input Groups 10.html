<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerHub - Job Application</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                CareerHub
            </a>

            <span class="text-white">
                Job Application
            </span>

        </div>
    </nav>


    <!-- Header -->
    <section class="bg-primary text-white py-5">

        <div class="container text-center">

            <h1 class="fw-bold">
                Join Our Team
            </h1>

            <p class="lead mb-0">
                Take the next step in your career with us.
            </p>

        </div>

    </section>


    <!-- Application Form -->
    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body p-4 p-md-5">

                            <h3 class="fw-bold mb-1">
                                Job Application
                            </h3>

                            <p class="text-muted mb-4">
                                Fill in your details carefully.
                            </p>


                            <!-- Name -->
                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        First Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Enter first name">

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Last Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Enter last name">

                                </div>

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="you@example.com">

                            </div>


                            <!-- Phone Input Group -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        +91
                                    </span>

                                    <input
                                        type="tel"
                                        class="form-control"
                                        placeholder="98765 43210">

                                </div>

                            </div>


                            <!-- Position -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Applying For
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Select Position
                                    </option>

                                    <option>
                                        Frontend Developer
                                    </option>

                                    <option>
                                        Backend Developer
                                    </option>

                                    <option>
                                        UI/UX Designer
                                    </option>

                                    <option>
                                        Software Engineer
                                    </option>

                                </select>

                            </div>


                            <!-- Experience -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Experience
                                </label>

                                <div class="input-group">

                                    <input
                                        type="number"
                                        class="form-control"
                                        placeholder="0">

                                    <span class="input-group-text">
                                        Years
                                    </span>

                                </div>

                            </div>


                            <!-- Message -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Cover Message
                                </label>

                                <textarea
                                    class="form-control"
                                    rows="4"
                                    placeholder="Tell us about yourself...">
                                </textarea>

                            </div>


                            <!-- Checkbox -->
                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="agree">

                                <label
                                    class="form-check-label"
                                    for="agree">

                                    I confirm that the information
                                    provided is correct.

                                </label>

                            </div>


                            <!-- Buttons -->
                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary px-4">

                                    Submit Application

                                </button>

                                <button
                                    type="reset"
                                    class="btn btn-outline-secondary">

                                    Clear

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <h5 class="fw-bold">
                CareerHub
            </h5>

            <p class="text-secondary mb-1">
                Connecting talented people with great opportunities.
            </p>

            <small class="text-secondary">
                © 2026 CareerHub. All Rights Reserved.
            </small>

        </div>

    </footer>

</body>
</html>
